<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Layout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 20px;
    }

    .full-bar {
      background: #ccc;
      text-align: center;
      padding: 30px;
      margin-bottom: 6px;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 60px;
       }

      .full-bar2 {
      background: #ccc;
      text-align: center;
      padding: 60px;
      margin-bottom: 10px;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 60px;
      }

    .boxes {
     display: grid;
     grid-template-columns: repeat(5,1fr) ;
      gap: 10px;
      margin-top: 10px;
    }

    .box {
      background: #999;
      flex: 1;
      text-align: center;
      padding: 80px 0;
      font-size: 1.7rem;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="full-bar">Logo</div>
  <div class="full-bar2">Header</div>
  <div class="full-bar">Text Area</div>

  <div class="boxes">
    <div class="box">Box1</div>
    <div class="box">Box2</div>
    <div class="box">Box3</div>
    <div class="box">Box4 </div>
     <div class="box">Box5 </div>
    
  </div>
   <div class="full-bar" margin-bottom: 10px;>Text Area</div>

</body>
</html>
